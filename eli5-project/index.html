<!DOCTYPE html>
<html>
<head>
    <title>ELI5 Simplifier with Wikipedia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 3D Brain Icon Styles */
        .floating-brain {
            position: fixed;
            width: 60px;
            height: 60px;
            pointer-events: none;
            z-index: 1000;
            transition: transform 0.1s ease-out;
            filter: drop-shadow(0 4px 12px rgba(59, 130, 246, 0.4));
        }

        .brain-3d {
            font-size: 50px;
            display: block;
            transform-style: preserve-3d;
            animation: float 3s ease-in-out infinite;
            transition: transform 0.1s ease-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotateY(0deg); }
            50% { transform: translateY(-10px) rotateY(180deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1) rotateX(0deg); }
            50% { transform: scale(1.1) rotateX(15deg); }
        }

        .brain-3d:hover {
            animation: pulse 0.6s ease-in-out infinite;
        }

        /* Gradient background for extra coolness */
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* Glowing text effect */
        .glow-text {
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body id="body" class="bg-gray-100 p-8 transition-colors duration-300 relative">
    <!-- 3D Floating Brain Icon -->
    <div id="floatingBrain" class="floating-brain">
        <span class="brain-3d">✏️</span>
    </div>

    <div class="max-w-4xl mx-auto">
        <!-- Header with theme toggle -->
        <div class="flex justify-between items-center mb-8">
            <h1 id="title" class="text-3xl font-bold text-gray-800 dark:text-gray-200 glow-text transition-all duration-300">
                🧸 ELI5 Simplifier + 🌍 Wikipedia
            </h1>
            
            <!-- Day/Night Mode Toggle -->
            <button 
                id="themeToggle"
                onclick="toggleTheme()" 
                class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 px-4 py-2 rounded-lg transition-all duration-200 flex items-center space-x-2 transform hover:scale-105"
            >
                <span id="themeIcon">🌙</span>
                <span id="themeText" class="text-gray-700 dark:text-gray-200">Dark Mode</span>
            </button>
        </div>
        
        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-[1.01]">
            <!-- Input -->
            <textarea 
                id="inputText" 
                placeholder="Ask anything! Try: 'Explain photosynthesis' or 'What is machine learning?'"
                class="w-full p-4 border border-gray-300 dark:border-gray-600 rounded mb-4 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400 transition-all duration-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                rows="4"
            ></textarea>
            
            <!-- Wikipedia Options -->
            <div class="mb-4 p-4 bg-blue-50 dark:bg-blue-900/20 rounded border border-blue-200 dark:border-blue-700 transition-all duration-300 hover:shadow-md">
                <label class="flex items-center mb-2">
                    <input type="checkbox" id="useWiki" checked class="mr-2 transform hover:scale-110 transition-transform duration-200">
                    <span class="font-medium text-gray-800 dark:text-gray-200">🌍 Use Wikipedia for accurate facts</span>
                </label>
                
                <input 
                    id="wikiTopic" 
                    type="text" 
                    placeholder="Topic for Wikipedia (e.g., 'photosynthesis', 'machine learning')"
                    class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400 transition-all duration-300 focus:ring-2 focus:ring-blue-500"
                />
                <p class="text-xs text-gray-600 dark:text-gray-400 mt-1 transition-colors duration-300">Leave empty to auto-detect topic from your question</p>
            </div>
            
            <!-- Level selector -->
            <select id="level" class="p-2 border border-gray-300 dark:border-gray-600 rounded mb-4 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 transition-all duration-300 focus:ring-2 focus:ring-blue-500">
                <option value="ELI5">ELI5 (5-year-old)</option>
                <option value="ELI15">ELI15 (15-year-old)</option>
                <option value="Normal">Normal</option>
            </select>
            
            <!-- Buttons -->
            <div class="flex space-x-2 mb-4">
                <button 
                    onclick="simplifyText()" 
                    class="bg-blue-500 hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-700 text-white px-6 py-2 rounded transition-all duration-200 flex-1 transform hover:scale-105 hover:shadow-lg"
                >
                    ✨ Simplify with AI + Wikipedia
                </button>
                
                <button 
                    onclick="testWiki()" 
                    class="bg-green-500 hover:bg-green-600 dark:bg-green-600 dark:hover:bg-green-700 text-white px-4 py-2 rounded transition-all duration-200 transform hover:scale-105"
                >
                    🔍 Test Wiki
                </button>
                
                <button 
                    onclick="clearAll()" 
                    class="bg-gray-500 hover:bg-gray-600 dark:bg-gray-600 dark:hover:bg-gray-700 text-white px-4 py-2 rounded transition-all duration-200 transform hover:scale-105"
                >
                    🗑️ Clear
                </button>
            </div>
            
            <!-- Status -->
            <div id="status" class="mb-4"></div>
            
            <!-- Output -->
            <div id="output" class="p-4 bg-gray-50 dark:bg-gray-700 rounded min-h-32 border border-gray-300 dark:border-gray-600 leading-relaxed text-gray-900 dark:text-gray-100 transition-all duration-300">
                Your enhanced explanation will appear here...
            </div>
        </div>
        
        <!-- Quick Examples -->
        <div class="mt-6 bg-white dark:bg-gray-800 p-4 rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-[1.01]">
            <h3 class="font-bold mb-2 text-gray-800 dark:text-gray-200">🚀 Try These Examples:</h3>
            <div class="flex flex-wrap gap-2">
                <button onclick="setExample('Explain photosynthesis', 'photosynthesis')" class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 px-3 py-1 rounded text-sm transition-all duration-200 text-gray-800 dark:text-gray-200 transform hover:scale-105">🌱 Photosynthesis</button>
                <button onclick="setExample('What is machine learning?', 'machine learning')" class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 px-3 py-1 rounded text-sm transition-all duration-200 text-gray-800 dark:text-gray-200 transform hover:scale-105">🤖 Machine Learning</button>
                <button onclick="setExample('How do black holes work?', 'black hole')" class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 px-3 py-1 rounded text-sm transition-all duration-200 text-gray-800 dark:text-gray-200 transform hover:scale-105">⚫ Black Holes</button>
                <button onclick="setExample('Explain DNA', 'DNA')" class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 px-3 py-1 rounded text-sm transition-all duration-200 text-gray-800 dark:text-gray-200 transform hover:scale-105">🧬 DNA</button>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-6 text-center text-gray-500 dark:text-gray-400 text-sm transition-colors duration-300">
           
        </div>
    </div>

    <script>
        // Theme management
        let isDarkMode = false;

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            
            const body = document.getElementById('body');
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            
            if (isDarkMode) {
                // Switch to dark mode
                body.className = 'bg-gray-900 p-8 transition-colors duration-300 relative';
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Mode';
                
                // Add dark class to all elements
                document.documentElement.classList.add('dark');
            } else {
                // Switch to light mode
                body.className = 'bg-gray-100 p-8 transition-colors duration-300 relative';
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark Mode';
                
                // Remove dark class
                document.documentElement.classList.remove('dark');
            }
            
            // Save preference
            localStorage.setItem('darkMode', isDarkMode);
        }

        // Load saved theme preference
        function loadTheme() {
            const savedTheme = localStorage.getItem('darkMode');
            if (savedTheme === 'true') {
                toggleTheme();
            }
        }

        // 3D Brain Animation - Follow Cursor
        const floatingBrain = document.getElementById('floatingBrain');
        let mouseX = 0, mouseY = 0;
        let brainX = 0, brainY = 0;

        // Update mouse position
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Smooth brain following animation
        function animateBrain() {
            // Lerp (linear interpolation) for smooth following
            brainX += (mouseX - brainX) * 0.1;
            brainY += (mouseY - brainY) * 0.1;
            
            // Apply position with offset so brain doesn't cover cursor
            floatingBrain.style.left = (brainX - 30) + 'px';
            floatingBrain.style.top = (brainY - 30) + 'px';
            
            requestAnimationFrame(animateBrain);
        }

        // Start brain animation
        animateBrain();

        // Add click effect to brain
        document.addEventListener('click', () => {
            const brain = floatingBrain.querySelector('.brain-3d');
            brain.style.animation = 'pulse 0.6s ease-in-out';
            setTimeout(() => {
                brain.style.animation = 'float 3s ease-in-out infinite';
            }, 600);
        });

        // Load theme on page load
        window.addEventListener('load', loadTheme);

        async function simplifyText() {
            const text = document.getElementById('inputText').value;
            const level = document.getElementById('level').value;
            const useWiki = document.getElementById('useWiki').checked;
            const topic = document.getElementById('wikiTopic').value;
            const output = document.getElementById('output');
            const status = document.getElementById('status');
            
            if (!text) {
                alert('Please enter some text!');
                return;
            }
            
            output.innerHTML = '⏳ Getting Wikipedia facts and generating explanation...';
            status.innerHTML = '';
            
            try {
                const response = await fetch('http://localhost:8000/simplify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        level: level,
                        use_wiki: useWiki,
                        topic: topic
                    })
                });
                
                const result = await response.json();
                
                // Dynamic status styling based on theme
                if (result.used_wiki) {
                    const successClass = isDarkMode 
                        ? 'bg-green-900 text-green-200 p-2 rounded text-sm shadow-lg'
                        : 'bg-green-100 text-green-800 p-2 rounded text-sm shadow-lg';
                    status.innerHTML = `<div class="${successClass}">✅ Enhanced with Wikipedia facts about: <strong>${result.wiki_title}</strong></div>`;
                } else {
                    const warningClass = isDarkMode 
                        ? 'bg-yellow-900 text-yellow-200 p-2 rounded text-sm shadow-lg'
                        : 'bg-yellow-100 text-yellow-800 p-2 rounded text-sm shadow-lg';
                    status.innerHTML = `<div class="${warningClass}">ℹ️ Generated without Wikipedia (topic not found or disabled)</div>`;
                }
                
                // ✨ Display with proper formatting
                output.innerHTML = '<div class="whitespace-pre-line leading-relaxed space-y-2">' + result.simplified_text + '</div>';
                
            } catch (error) {
                const errorClass = isDarkMode 
                    ? 'bg-red-900 text-red-200 p-2 rounded text-sm shadow-lg'
                    : 'bg-red-100 text-red-800 p-2 rounded text-sm shadow-lg';
                
                output.innerHTML = '❌ Error: ' + error.message;
                status.innerHTML = `<div class="${errorClass}">❌ Failed to generate explanation</div>`;
            }
        }
        
        async function testWiki() {
            const topic = document.getElementById('wikiTopic').value;
            if (!topic) {
                alert('Enter a topic first!');
                return;
            }
            
            try {
                const response = await fetch(`http://localhost:8000/wiki/${encodeURIComponent(topic)}`);
                const result = await response.json();
                
                if (result.error) {
                    alert('Topic not found on Wikipedia');
                } else {
                    alert(`Found: ${result.title}\n\nSummary: ${result.summary.substring(0, 200)}...`);
                }
            } catch (error) {
                alert('Error testing Wikipedia');
            }
        }
        
        function setExample(text, topic) {
            document.getElementById('inputText').value = text;
            document.getElementById('wikiTopic').value = topic;
            document.getElementById('useWiki').checked = true;
        }
        
        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('wikiTopic').value = '';
            document.getElementById('output').innerHTML = 'Your enhanced explanation will appear here...';
            document.getElementById('status').innerHTML = '';
        }
    </script>
</body>
</html>
